<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6fdf">
<title>도배 예상 견적</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fa; --card: #ffffff; --text: #1d2733; --muted: #667085; --line: #e1e6ee;
    --accent: #2f6fdf; --accent-weak: #e8f0fd; --danger: #c43d3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.55;
    padding: 0 max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { padding: 28px 0 14px; }
  header small { color: var(--accent); font-weight: 700; font-size: 14px; }
  header h1 { margin: 2px 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .card h2 span { color: var(--accent); margin-right: 6px; }
  input[type="number"] {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  input[type="number"]:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  .unit { display: flex; align-items: center; gap: 10px; }
  .unit b { font-size: 16px; color: var(--muted); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .chip span { display: block; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-weight: 600; font-size: 15px; }
  .chip input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stepper { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 22px; cursor: pointer; color: var(--text); }
  .stepper button:active { background: var(--accent-weak); }
  .stepper output { min-width: 64px; text-align: center; font-size: 18px; font-weight: 700; }
  .stepper .lbl { font-weight: 600; }
  .papers { display: grid; gap: 8px; }
  .paper { position: relative; }
  .paper input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .paper span { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-weight: 600; background: #fff; }
  .paper input:checked + span { border-color: var(--accent); background: var(--accent-weak); box-shadow: inset 0 0 0 1px var(--accent); }
  .paper input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opts { display: grid; gap: 4px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 15px; }
  .opt input { width: 20px; height: 20px; }
  .result { border: 2px solid var(--accent); background: #fff; }
  .result .k { color: var(--muted); font-size: 14px; }
  .result .v { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .result .s { color: var(--muted); font-size: 13px; }
  .result.wait .v { font-size: 18px; color: var(--muted); font-weight: 600; }
  .msg { color: var(--danger); font-size: 14px; margin-top: 8px; }
  .call { display: block; text-align: center; margin-top: 14px; background: var(--accent); color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 700; }
  .note { color: var(--muted); font-size: 12.5px; margin: 14px 4px 0; }
  .center { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <small id="company">도배</small>
    <h1>우리 집 도배 예상 견적</h1>
    <p>집 정보를 고르면 대략적인 금액을 바로 알려 드려요.</p>
  </header>

  <div id="loading" class="center">불러오는 중...</div>

  <main id="app" hidden>
    <section class="card">
      <h2><span>1</span>아파트 평수</h2>
      <div class="unit"><input type="number" id="py" inputmode="decimal" min="10" max="120" step="1" placeholder="예: 34" aria-label="아파트 평수"><b>평형</b></div>
    </section>

    <section class="card">
      <h2><span>2</span>도배할 공간</h2>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="living" checked><span>거실·주방</span></label>
        <label class="chip"><input type="checkbox" id="master" checked><span>안방</span></label>
        <label class="chip"><input type="checkbox" id="dress"><span>드레스룸</span></label>
        <label class="chip"><input type="checkbox" id="entry" checked><span>현관·복도</span></label>
      </div>
      <div class="stepper">
        <span class="lbl">작은방</span>
        <button type="button" id="smallMinus" aria-label="작은방 하나 줄이기">−</button>
        <output id="small" aria-live="polite">2개</output>
        <button type="button" id="smallPlus" aria-label="작은방 하나 늘리기">+</button>
      </div>
    </section>

    <section class="card">
      <h2><span>3</span>벽지 종류</h2>
      <div class="papers" id="papers"></div>
    </section>

    <section class="card">
      <h2><span>4</span>옵션</h2>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="ceiling" checked>천장도 도배해요</label>
        <label class="opt"><input type="checkbox" id="demo">기존 벽지를 뜯어내야 해요 (철거)</label>
      </div>
    </section>

    <section class="card result wait" id="result" aria-live="polite">
      <div class="k">예상 금액</div>
      <div class="v" id="rv">평수를 입력해 주세요</div>
      <div class="s" id="rs"></div>
      <div class="msg" id="rm"></div>
      <a class="call" id="call" href="#" hidden>전화로 상담하기</a>
    </section>
    <p class="note">이 금액은 입력하신 정보로 계산한 대략적인 범위예요. 벽 상태, 가구 이동, 몰딩·문틀 등 현장 상황에 따라 달라질 수 있고, 정확한 금액은 방문 후 안내해 드립니다.</p>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cfg = null, smallTouched = false, dressTouched = false, small = 2, seq = 0, timer = null;

  function manwon(n) { return Math.round(n / 10000).toLocaleString('ko-KR'); }

  function nearest(py) {
    var best = null;
    (cfg.layouts || []).forEach(function (l) { if (!best || Math.abs(l.py - py) < Math.abs(best.py - py)) best = l; });
    return best;
  }

  function setSmall(n) { small = Math.max(0, Math.min(6, n)); $('small').textContent = small + '개'; }

  function applyLayoutDefaults() {   // 평수에 맞는 기본 방 구성 (손대지 않은 칸만 바꿈)
    var py = parseFloat($('py').value), l = isFinite(py) ? nearest(py) : null;
    if (!l) return;
    if (!smallTouched) setSmall(l.small);
    if (!dressTouched) $('dress').checked = l.dress;
  }

  function input() {
    return {
      py: parseFloat($('py').value),
      spaces: { living: $('living').checked, master: $('master').checked, dress: $('dress').checked, entry: $('entry').checked, small: small },
      paper: (document.querySelector('input[name="paper"]:checked') || {}).value,
      ceiling: $('ceiling').checked, demolition: $('demo').checked,
    };
  }

  function show(wait, v, s, m) {
    $('result').classList.toggle('wait', !!wait);
    $('rv').textContent = v; $('rs').textContent = s || ''; $('rm').textContent = m || '';
  }

  function calc() {
    var data = input(), my = ++seq;
    if (!isFinite(data.py)) { show(true, '평수를 입력해 주세요'); return; }
    show(true, '계산하는 중...');
    fetch('/api/estimate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (my !== seq) return;   // 더 최근에 바꾼 값이 있으면 이전 결과는 버림
        if (!j.ok) { show(true, '확인이 필요해요', '', j.msg || '계산하지 못했어요.'); return; }
        show(false, '약 ' + manwon(j.low) + ' ~ ' + manwon(j.high) + '만원', (j.vat ? '부가세 포함' : '부가세 별도') + ' · 시공 면적 약 ' + j.pyeong.toFixed(1) + '평');
      })
      .catch(function () { if (my === seq) show(true, '연결이 불안정해요', '', '인터넷 연결을 확인하고 다시 시도해 주세요.'); });
  }

  function later() { clearTimeout(timer); timer = setTimeout(calc, 250); }

  $('py').addEventListener('input', function () { applyLayoutDefaults(); later(); });
  ['living', 'master', 'entry', 'ceiling', 'demo'].forEach(function (id) { $(id).addEventListener('change', later); });
  $('dress').addEventListener('change', function () { dressTouched = true; later(); });
  $('smallMinus').addEventListener('click', function () { smallTouched = true; setSmall(small - 1); later(); });
  $('smallPlus').addEventListener('click', function () { smallTouched = true; setSmall(small + 1); later(); });

  fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
    $('loading').hidden = true;
    if (!c.ready) { $('loading').hidden = false; $('loading').textContent = '견적 준비 중입니다. 잠시 후 다시 들어와 주세요.'; return; }
    cfg = c;
    if (c.company) { $('company').textContent = c.company; document.title = c.company + ' 도배 예상 견적'; }
    var box = $('papers');
    c.materials.forEach(function (m, i) {
      var label = document.createElement('label'); label.className = 'paper';
      var inp = document.createElement('input'); inp.type = 'radio'; inp.name = 'paper'; inp.value = m.id; if (i === 0) inp.checked = true;
      inp.addEventListener('change', later);
      var sp = document.createElement('span'); sp.textContent = m.name;
      label.appendChild(inp); label.appendChild(sp); box.appendChild(label);
    });
    if (c.phone) { var a = $('call'); a.hidden = false; a.href = 'tel:' + c.phone.replace(/[^0-9+]/g, ''); a.textContent = c.phone + ' 전화로 상담하기'; }
    $('app').hidden = false;
  }).catch(function () { $('loading').textContent = '불러오지 못했어요. 인터넷 연결을 확인하고 다시 들어와 주세요.'; });
})();
</script>
</body>
</html>
